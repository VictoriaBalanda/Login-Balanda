<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preceptor - Instituto Superior Santa María</title>
    <script src="cosourl.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-admin">
    <header class="encabezado">
        <img src="logo.png" alt="Logo del colegio" class="logo">
        <p class="nombre-colegio">
            Instituto Superior Santa María
        </p>
    </header>
    <main class="contenido">
        <div class="panel-superior">
            <h1>Panel de Asistencia</h1>
            <button class="btn-cerrar" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>
        </div>
        <div class="tarjeta-lista">
            <h2>Lista de Alumnos</h2>
            <div id="listaAlumnos"></div>
            <p id="mensajeAsistencia"></p>
        </div>
    </main>
    <script src="asistencia.js"></script>
</body>
</html>
